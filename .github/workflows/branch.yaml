name: Push
on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.12']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Installing python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Installing dependencies
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest 
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
  code-quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.12']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install dependencies
        run: uv sync --locked --dev 
      - name: Run black
        run: uv run black . --check
      - name: Run isort
        run: uv run isort . --check-only --profile black
      - name: Run flake8
        run: uv run flake8 .
      - name: Run bandit
        run: uv run bandit .
      - name: Run saftey
        run: uv run safety check
